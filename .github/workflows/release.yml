# Build the Windows program and attach it to the release.
#
# Trigger: publishing a release on GitHub (Releases -> Draft a new release ->
# Publish). GitHub then starts a Windows machine, installs Python, builds
# dist\marsad with PyInstaller from packaging\marsad.spec, zips it, and uploads
# marsad-<tag>-windows-x64.zip to that same release. About ten minutes.
#
# "Run workflow" on the Actions tab builds it by hand without a release; the
# zip is then on the workflow run page under Artifacts.

name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write        # needed to attach the zip to the release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Regression tests
        # The tests that need the station's raw surveys skip here; the pure
        # arithmetic ones (scan geometry, config, fingerprint) still run.
        run: python -m pytest -q

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm packaging/marsad.spec

      - name: Smoke test the build
        run: |
          dist\marsad\marsad.exe version
          dist\marsad\marsad.exe run LS 1h --dry-run

      - name: Zip
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev" }
          $zip = "marsad-$tag-windows-x64.zip"
          Compress-Archive -Path dist/marsad -DestinationPath $zip -CompressionLevel Optimal
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Keep the zip on the run page
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP }}
          path: ${{ env.ZIP }}

      - name: Attach to the release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ env.ZIP }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
